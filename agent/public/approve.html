<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QoreBills signature</title>
<style>
  :root { --bg: #f6f7fb; --card: #ffffff; --text: #141824; --muted: #5d6475; --line: #e3e6ee; --accent: #3a4fd9; --ok: #157a4a; --bad: #b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f121a; --card: #171b26; --text: #eef0f6; --muted: #a2a9ba; --line: #2a3040; --accent: #8193ff; --ok: #5bd49a; --bad: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .summary { font-size: 1.15rem; font-weight: 600; }
  pre { white-space: pre-wrap; word-break: break-all; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 8px 0 0; color: var(--muted); }
  button { width: 100%; padding: 14px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 14px; min-height: 1.5em; word-break: break-all; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1 id="title">Sign in QoreX</h1>
  <p class="sub" id="intro">Your QoreBills agent needs your post-quantum signature.</p>
  <div class="card">
    <div class="summary" id="summary">Loading…</div>
    <div class="sub" id="expiry" style="margin:4px 0 0"></div>
  </div>
  <div class="card">
    <strong>You will sign exactly this text</strong>
    <pre id="message"></pre>
  </div>
  <button id="sign" disabled>Sign with QoreX</button>
  <div id="status" role="status"></div>
</main>
<script src="/qorex.js"></script>
<script>
(() => {
  const id = location.pathname.split("/").pop();
  const $ = (x) => document.getElementById(x);
  const say = (text, cls = "") => { $("status").className = cls; $("status").textContent = text; };
  let request = null;

  async function load() {
    const r = await fetch(`/api/requests/${id}`, { cache: "no-store" });
    if (!r.ok) { $("summary").textContent = "This link is not valid."; return; }
    request = await r.json();
    if (request.kind === "payment") {
      $("title").textContent = "Approve a bill payment";
      $("intro").textContent = "This payment is above your auto-pay limit, so it needs your post-quantum signature.";
    } else {
      $("title").textContent = "Change a setting";
      $("intro").textContent = "Settings change only with your post-quantum signature.";
    }
    $("summary").textContent = request.summary;
    $("message").textContent = request.message;
    $("expiry").textContent = `Valid until ${new Date(request.expiresAt * 1000).toLocaleString()}`;
    if (request.status === "done") say("Already done.", "ok");
    else if (request.status !== "pending") say(`This request is ${request.status}. Ask the bot again.`, "bad");
    else $("sign").disabled = false;
  }

  $("sign").addEventListener("click", async () => {
    $("sign").disabled = true;
    try {
      const { signature } = await QoreXSign.sign(request.cosmosChainId, request.message, request.ownerBech32, say);
      say("Signed. Sending it…");
      const out = await QoreXSign.post(`/api/requests/${id}/sign`, { signature });
      say(`Done. Your signature was verified on chain. Transaction: ${out.txHash}`, "ok");
    } catch (error) {
      say(error.message || String(error), "bad");
      $("sign").disabled = false;
    }
  });

  load().catch(() => { $("summary").textContent = "Could not load this request."; });
})();
</script>
</body>
</html>
