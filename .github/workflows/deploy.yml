name: Deploy

# Every push to main that touches the agent is tested, then deployed to the Oracle VM.
# Repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   DEPLOY_SSH_KEY      the same deploy key as the claude-tools repository
#   TELEGRAM_BOT_TOKEN  from @BotFather
#   OWNER_TELEGRAM_ID   your numeric Telegram user id
#   GEMINI_API_KEY      optional, for free-form requests
# The rest is not secret and lives below.

on:
  push:
    branches: [main]
    paths: ["agent/**", "docker-compose.yml", "deploy/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-qorebills
  cancel-in-progress: false

env:
  SERVER_IP: 145.241.232.214
  SERVER_USER: ubuntu
  SERVER_HOST_KEY: "145.241.232.214 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBmPWZg2G3V4WRNhglYCMgaVlpedf4PVS1u+xXiRaACX"
  APP_DIR: ~/qorebills
  REPO_URL: https://github.com/16navigabraham/qorebills.git
  PUBLIC_URL: https://bills.145-241-232-214.sslip.io
  FACTORY_ADDRESS: "0xF0385815a19009FBC01ba24773469c5e4e4e9b2D"

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check settings
        id: check
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
        run: |
          # Until everything is configured, skip the deploy with a notice instead of failing.
          missing=""
          for name in SSH_KEY TELEGRAM_BOT_TOKEN OWNER_TELEGRAM_ID; do
            [ -n "${!name}" ] || missing="$missing secret:${name/SSH_KEY/DEPLOY_SSH_KEY}"
          done
          [ -n "$FACTORY_ADDRESS" ] || missing="$missing FACTORY_ADDRESS"
          if [ -n "$missing" ]; then
            echo "::notice::Not deploying yet; missing:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.check.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_HOST_KEY" > ~/.ssh/known_hosts

      - name: Deploy ${{ github.sha }}
        if: steps.check.outputs.ready == 'true'
        env:
          SHA: ${{ github.sha }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ssh_vm() { ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$SERVER_USER@$SERVER_IP" "$@"; }
          ssh_vm "set -e; [ -d $APP_DIR/.git ] || git clone --quiet $REPO_URL $APP_DIR; cd $APP_DIR && git fetch --quiet origin main && git reset --quiet --hard && git checkout --quiet -B main $SHA"
          # .env is written over SSH from the secrets, so they never sit in the repository or the logs.
          {
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'OWNER_TELEGRAM_ID=%s\n' "$OWNER_TELEGRAM_ID"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'FACTORY_ADDRESS=%s\n' "$FACTORY_ADDRESS"
            printf 'PUBLIC_URL=%s\n' "$PUBLIC_URL"
            printf 'STATE_FILE=/app/data/state.json\n'
            printf 'AGENT_KEY_FILE=/app/data/agent.mnemonic\n'
          } | ssh_vm "umask 077; cat > $APP_DIR/.env"
          ssh_vm "cd $APP_DIR && bash deploy/update.sh"
